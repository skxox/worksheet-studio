name: 缺陷报告
description: 报告一个可复现的问题
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量描述清楚复现步骤，附上截图更佳。

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 发生了什么？期望的结果是什么？
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 进入「……」
        2. 点击「……」
        3. 看到「……」
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: 涉及模块
      options:
        - 字帖工坊 /copybook
        - 手写模拟器 /handwriting
        - 纸张工厂 /paper
        - 首页 / 导航
        - 其它
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: 环境
      placeholder: 浏览器、操作系统、屏幕尺寸（如 Chrome 130 / macOS / 1440px）
    validations:
      required: false
